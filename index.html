<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Read&amp;Learn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main Home Page -->
    <div id="homePage" class="page active">
        <div class="home-container">
            <div class="home-emblem">✦</div>
            <div class="logo">Read&amp;Learn</div>
            <p class="tagline">Изучайте языки через чтение</p>
            <button class="btn btn-primary btn-large" onclick="goToTexts()">Начать чтение</button>
        </div>
    </div>

    <!-- Texts List Page -->
    <div id="textsPage" class="page">
        <div class="header">
            <button class="btn-back" onclick="goHome()">←</button>
            <h1>Тексты</h1>
            <div></div>
        </div>
        <div class="texts-container" id="textsContainer"></div>
    </div>

    <!-- Reader Page -->
    <div id="readerPage" class="page">
        <div class="header">
            <button class="btn-back" onclick="goToTexts()">←</button>
            <h1 id="textTitle"></h1>
            <div></div>
        </div>

        <div class="reader-controls">
            <div class="control-group">
                <label>Язык:</label>
                <select id="languageSelect" onchange="updateTextDisplay()">
                    <option value="ru">Русский (оригинал)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Режим:</label>
                <select id="modeSelect" onchange="updateTextDisplay()">
                    <option value="highlight">Перевод по словам</option>
                    <option value="sentences">Перевод по предложениям</option>
                    <option value="full">Показать переведённый текст</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="openExplain()">
                Объяснение текста
            </button>
        </div>

        <div class="text-content" id="textContent"></div>
    </div>

    <!-- Word Translation Popup -->
    <div id="wordPopup" class="popup" style="display:none;">
        <div class="popup-content">
            <button class="btn-close" onclick="closeWordPopup()">×</button>
            <div class="popup-label">Слово</div>
            <div class="popup-word" id="popupWord"></div>
            <div class="popup-divider"></div>
            <div class="popup-label">Перевод</div>
            <div class="popup-translation" id="popupTranslation"></div>
            <button class="btn btn-secondary" onclick="showGrammar()">Подробнее →</button>
        </div>
    </div>

    <!-- Grammar Popup (centered modal) -->
    <div id="grammarWrapper" class="grammar-popup-wrapper">
        <div id="grammarPopup">
            <button class="btn-close" onclick="closeGrammarPopup()">×</button>
            <div class="grammar-popup-header">
                <div class="popup-label">Грамматика</div>
                <h3 id="grammarWord"></h3>
            </div>
            <div id="grammarContent" class="grammar-content"></div>
        </div>
    </div>
    <!-- Explain Fullscreen -->
    <div id="explainModal" class="explain-modal">
        <div class="explain-header">
            <button class="btn-back" onclick="closeExplain()">←</button>
            <h2>Объяснение</h2>
            <div></div>
        </div>

        <div id="explainContent" class="explain-content"></div>
    </div>
    <!-- Overlay -->
    <div id="overlay" class="overlay" onclick="closeAllPopups()" style="display:none;"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
